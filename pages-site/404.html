<title>Redirection…</title>
<script>
(function () {
  var base = '/skills-copilot-codespaces-vscode';
  var path = location.pathname;
  // If missing asset under /jeu/, send to jeu index (client router can take over only for app entry)
  if (path.indexOf(base + '/jeu') === 0) {
    location.replace(base + '/jeu/');
    return;
  }
  location.replace(base + '/');
})();
</script>
</head>
